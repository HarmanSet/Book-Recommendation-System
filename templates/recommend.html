<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendations | BookScout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">BookScout</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/recommend">Recommend</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="page-title">Book Recommendations</h1>
                <p class="lead mb-4">Enter a book title you enjoy to receive personalized recommendations</p>
            </div>

            <!-- Search Form -->
            <div class="col-lg-8 mx-auto mb-5">
                <div class="search-form">
                    <form action="/recommend_books" method="post">
                        <div class="mb-3">
                            <label for="user_input" class="form-label">Book Title</label>
                            <input name="user_input" id="user_input" type="text" class="form-control form-control-lg" placeholder="Enter a book title you've enjoyed...">
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-lg search-btn">
                                <i class="fas fa-search me-2"></i> Get Recommendations
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Results Section -->
            {% if data %}
            <div class="col-12">
                <h2 class="mb-4">Books You Might Enjoy</h2>
            </div>

            {% for i in data %}
            <div class="col-md-6 col-lg-3 mb-4">
                <div class="book-card">
                    <div class="card-img-container">
                        <img class="card-img-top" src="{{ i[2] }}" alt="{{ i[0] }}">
                    </div>
                    <div class="card-body">
                        <h2 class="book-title">{{ i[0] }}</h2>
                        <h3 class="book-author">{{ i[1] }}</h3>
                    </div>
                </div>
            </div>
            {% endfor %}
            {% endif %}
        </div>
    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-paPk90pUugR8Wn6CHu6v4mWmM6M0U2bTgQw4tKJK2OqAOzXAa6KY1JikQUMAJK1k" crossorigin="anonymous"></script>
</body>
</html>

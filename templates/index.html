<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommender System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">BookScout</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/recommend">Recommend</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="page-title">Top 50 Books</h1>
                <p class="lead mb-4">Discover the most popular books based on reader ratings and reviews</p>
            </div>

            {% for book in books %}
            <div class="col-md-6 col-lg-3 mb-4">
                <div class="book-card">
                    <div class="card-img-container">
                        <img class="card-img-top" src="{{ book['Image-URL-M_x'] }}" alt="{{ book['Book-Title'] }}">
                    </div>
                    <div class="card-body">
                        <h2 class="book-title">{{ book['Book-Title'] }}</h2>
                        <h3 class="book-author">{{ book['Book-Author_x'] }}</h3>
                        <div class="book-ratings">
                            <span class="rating-count">
                                <i class="fas fa-users"></i> {{ book['num_ratings'] }}
                            </span>
                            <span class="rating-avg">
                                <i class="fas fa-star"></i> {{ book['avg_rating'] | round(2) }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-paPk90pUugR8Wn6CHu6v4mWmM6M0U2bTgQw4tKJK2OqAOzXAa6KY1JikQUMAJK1k" crossorigin="anonymous"></script>
</body>
</html>
